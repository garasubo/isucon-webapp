[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { version = "1.0.104", features = ["backtrace"] }
axum = { version = "0.7.9", features = ["macros", "multipart"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenv = "0.15.0"
envy = "0.4.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8.6", features = ["mysql", "runtime-tokio", "chrono"] }
thiserror = "1.0.69"
tokio = { version = "1.53.1", features = ["full"] }
tower = "0.5.3"

[profile.release]
debug = true
