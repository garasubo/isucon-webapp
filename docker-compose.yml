version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: isucon-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: webapp
      MYSQL_USER: isucon
      MYSQL_PASSWORD: isucon
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: isucon-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - MYSQL_PORT=3306
      - MYSQL_HOST=mysql
      - APP_REPOSITORY=https://github.com/garasubo/isucon14
      - DEPLOY_COMMAND=echo "Deploy command placeholder"
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
    working_dir: /app
    command: cargo watch -x run

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: isucon-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - BACKEND_URL=http://backend:8080
    volumes:
      - ./frontend:/app
      - /app/node_modules
    working_dir: /app
    command: npm run dev

volumes:
  mysql-data:
